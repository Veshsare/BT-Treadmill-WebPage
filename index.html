<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Walking Pad</title>
<style>
  :root { --bg:#111418; --card:#1b2027; --fg:#e8eaed; --muted:#8b939e; --accent:#3ddc84; --stop:#e5484d; --btn:#2a313b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width: 480px; margin: 0 auto; padding: 16px; display:flex; flex-direction:column; gap:14px; }
  header { display:flex; justify-content:space-between; align-items:center; }
  h1 { font-size: 18px; margin:0; font-weight:600; }
  #status { font-size: 13px; color: var(--muted); }
  #status.ok { color: var(--accent); }
  .card { background:var(--card); border-radius:16px; padding:16px; }
  .speed { text-align:center; }
  .speed .val { font-size: 72px; font-weight:700; font-variant-numeric: tabular-nums; line-height:1; }
  .speed .unit { color:var(--muted); font-size:14px; }
  .speed .target { color:var(--muted); font-size:14px; margin-top:6px; min-height:18px; }
  .stats { display:grid; grid-template-columns: 1fr 1fr; gap:10px; text-align:center; }
  .stats .v { font-size: 22px; font-weight:600; font-variant-numeric: tabular-nums; }
  .stats .l { font-size: 12px; color: var(--muted); }
  button { font: inherit; border:0; border-radius:12px; background:var(--btn); color:var(--fg); padding:16px 0; font-size:18px; font-weight:600; cursor:pointer; touch-action: manipulation; }
  button:active { filter: brightness(1.3); }
  button:disabled { opacity:.35; }
  .row { display:grid; gap:10px; }
  .r2 { grid-template-columns: 1fr 1fr; }
  .r4 { grid-template-columns: repeat(4, 1fr); }
  .r5 { grid-template-columns: repeat(5, 1fr); }
  #connect { background: #2f6fed; }
  #start { background: var(--accent); color:#06210f; }
  #stop { background: var(--stop); }
  .small { font-size:15px; padding:12px 0; }
  details summary { color:var(--muted); font-size:13px; cursor:pointer; }
  #log { width:100%; height:220px; margin-top:8px; background:#0b0d10; color:#b9c0ca; border:0; border-radius:8px; padding:8px; font: 11px/1.4 ui-monospace, Menlo, monospace; }
  .hint { font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Walking Pad</h1>
    <span id="status">Non connesso</span>
  </header>

  <button id="connect">Connetti</button>

  <div class="card speed">
    <div class="val" id="speed">0.0</div>
    <div class="unit">km/h</div>
    <div class="target" id="target"></div>
  </div>

  <div class="card stats">
    <div><div class="v" id="dist">0.00</div><div class="l">km</div></div>
    <div><div class="v" id="time">0:00</div><div class="l">tempo (da Start)</div></div>
  </div>

  <div class="row r2">
    <button id="start" disabled>Start</button>
    <button id="stop" disabled>Stop</button>
  </div>

  <div class="row r4">
    <button class="ctl" data-d="-0.5" disabled>−0.5</button>
    <button class="ctl" data-d="-0.1" disabled>−0.1</button>
    <button class="ctl" data-d="0.1" disabled>+0.1</button>
    <button class="ctl" data-d="0.5" disabled>+0.5</button>
  </div>

  <div class="row r5" id="presets">
    <button class="ctl small" data-p="2" disabled>2</button>
    <button class="ctl small" data-p="3" disabled>3</button>
    <button class="ctl small" data-p="4" disabled>4</button>
    <button class="ctl small" data-p="5" disabled>5</button>
    <button class="ctl small" data-p="6" disabled>6</button>
  </div>

  <button id="pause" class="small" disabled>Pausa</button>

  <div class="hint">Tastiera: Invio = Start · Spazio/Esc = Stop · ↑/↓ = ±0.1 · Shift+↑/↓ = ±0.5</div>

  <details class="card">
    <summary>Log tecnico</summary>
    <textarea id="log" readonly></textarea>
    <div class="row r2" style="margin-top:8px">
      <button id="copy" class="small">Copia log</button>
      <button id="clear" class="small">Pulisci</button>
    </div>
    <div class="row r2" style="margin-top:8px">
      <button id="testStr" class="small">Test: UUID numerici</button>
      <button id="testAll" class="small">Test: tutti i dispositivi</button>
    </div>
  </details>
</main>

<script>
(() => {
  // FTMS UUIDs (Bluetooth SIG)
  const FTMS_SERVICE   = 0x1826;
  const TREADMILL_DATA = 0x2ACD;
  const SPEED_RANGE    = 0x2AD4;
  const CONTROL_POINT  = 0x2AD9;
  const MACHINE_STATUS = 0x2ADA;
  const FITSHOW_SVC    = 0xFFF0;

  const $ = id => document.getElementById(id);
  const logEl = $('log');
  const hex = dv => Array.from(new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength))
                        .map(b => b.toString(16).padStart(2, '0')).join(' ');
  function log(msg) {
    const t = new Date().toLocaleTimeString('it-IT');
    logEl.value += `[${t}] ${msg}\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  let device = null, cp = null;
  let currentSpeed = 0, targetSpeed = null;
  let range = { min: 1.0, max: 6.0, inc: 0.1 };
  let startedAt = null, timerId = null, dataPackets = 0;
  let writeQueue = Promise.resolve();
  let speedTimer = null;
  let wakeLock = null;

  function setConnected(on) {
    $('status').textContent = on ? `Connesso: ${device.name || 'dispositivo'}` : 'Non connesso';
    $('status').className = on ? 'ok' : '';
    $('connect').textContent = on ? 'Disconnetti' : 'Connetti';
    document.querySelectorAll('#start, #stop, #pause, .ctl').forEach(b => b.disabled = !on);
  }

  // ---- Scrittura sul Control Point (serializzata) ----
  function write(bytes, label) {
    writeQueue = writeQueue.then(async () => {
      if (!cp) throw new Error('Control Point non disponibile');
      const v = new Uint8Array(bytes);
      log(`→ ${label}: ${Array.from(v).map(b => b.toString(16).padStart(2,'0')).join(' ')}`);
      if (cp.writeValueWithResponse) await cp.writeValueWithResponse(v);
      else await cp.writeValue(v);
    }).catch(e => log(`✗ Errore scrittura (${label}): ${e.message}`));
    return writeQueue;
  }

  const OPS = { 0x00: 'Request Control', 0x01: 'Reset', 0x02: 'Set Target Speed', 0x07: 'Start/Resume', 0x08: 'Stop/Pause' };
  const RES = { 0x01: 'OK', 0x02: 'Non supportato', 0x03: 'Parametro non valido', 0x04: 'Operazione fallita', 0x05: 'Controllo non permesso' };

  function onControlPoint(e) {
    const dv = e.target.value;
    if (dv.byteLength >= 3 && dv.getUint8(0) === 0x80) {
      const op = dv.getUint8(1), res = dv.getUint8(2);
      log(`← Risposta ${OPS[op] || ('0x' + op.toString(16))}: ${RES[res] || ('0x' + res.toString(16))}`);
    } else {
      log(`← Control Point: ${hex(dv)}`);
    }
  }

  const STATUS = { 0x01: 'Reset', 0x02: 'Fermato/pausa dall’utente', 0x03: 'Fermato dalla safety key', 0x04: 'Avviato dall’utente',
                   0x05: 'Velocità target cambiata', 0xFF: 'Controllo perso' };
  function onStatus(e) {
    const dv = e.target.value;
    const op = dv.getUint8(0);
    let extra = '';
    if (op === 0x05 && dv.byteLength >= 3) extra = ` → ${(dv.getUint16(1, true) / 100).toFixed(1)} km/h`;
    log(`← Stato macchina: ${STATUS[op] || ('0x' + op.toString(16))}${extra} [${hex(dv)}]`);
    if (op === 0x02 || op === 0x03) stopTimer();
    if (op === 0x04) startTimer();
  }

  // ---- Treadmill Data: velocità (bit0=0) e distanza (bit2) ----
  function onTreadmillData(e) {
    const dv = e.target.value;
    if (dataPackets < 5) log(`← Treadmill Data: ${hex(dv)}`);
    dataPackets++;
    try {
      const flags = dv.getUint16(0, true);
      let i = 2;
      if (!(flags & 0x0001)) { currentSpeed = dv.getUint16(i, true) / 100; i += 2; $('speed').textContent = currentSpeed.toFixed(1); }
      if (flags & 0x0002) i += 2; // velocità media
      if (flags & 0x0004) {
        const m = dv.getUint16(i, true) | (dv.getUint8(i + 2) << 16);
        $('dist').textContent = (m / 1000).toFixed(2);
      }
      if (targetSpeed !== null && Math.abs(currentSpeed - targetSpeed) < 0.05) { targetSpeed = null; $('target').textContent = ''; }
    } catch (err) { log(`Parsing fallito: ${err.message}`); }
  }

  // ---- Timer locale ----
  function startTimer() {
    if (timerId) return;
    startedAt = startedAt || Date.now();
    timerId = setInterval(() => {
      const s = Math.floor((Date.now() - startedAt) / 1000);
      $('time').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }, 1000);
  }
  function stopTimer() { clearInterval(timerId); timerId = null; }

  // ---- Comandi ----
  function clamp(v) { return Math.min(range.max, Math.max(range.min, Math.round(v * 10) / 10)); }

  function requestSpeed(v) {
    targetSpeed = clamp(v);
    $('target').textContent = `→ ${targetSpeed.toFixed(1)} km/h`;
    clearTimeout(speedTimer);
    speedTimer = setTimeout(() => {
      const raw = Math.round(targetSpeed * 100);
      write([0x02, raw & 0xff, (raw >> 8) & 0xff], `Velocità ${targetSpeed.toFixed(1)}`);
    }, 300); // raggruppa i tocchi rapidi
  }
  function changeSpeed(delta) { requestSpeed((targetSpeed ?? currentSpeed ?? 0) + delta); }

  function start() { write([0x07], 'Start'); startTimer(); }
  function stop()  { targetSpeed = null; $('target').textContent = ''; write([0x08, 0x01], 'Stop'); stopTimer(); startedAt = null; }
  function pause() { write([0x08, 0x02], 'Pausa'); stopTimer(); }

  // Alcuni browser (es. Bluefy) rifiutano con oggetti non standard: estrai tutto il possibile
  function describeError(e) {
    if (e === undefined) return 'undefined (nessun dettaglio)';
    if (typeof e === 'string') return e;
    const parts = [];
    if (e.name) parts.push(`name=${e.name}`);
    if (e.message) parts.push(`message=${e.message}`);
    if (e.code !== undefined) parts.push(`code=${e.code}`);
    try { const j = JSON.stringify(e); if (j && j !== '{}') parts.push(`json=${j}`); } catch (_) {}
    if (!parts.length) parts.push(`String=${String(e)}`);
    return parts.join(' | ');
  }

  // ---- Connessione ----
  let connecting = false;
  const uuid16 = n => `0000${n.toString(16).padStart(4, '0')}-0000-1000-8000-00805f9b34fb`;
  function requestOptions(mode) {
    if (mode === 'all') {
      return { acceptAllDevices: true, optionalServices: [uuid16(FTMS_SERVICE), uuid16(FITSHOW_SVC)] };
    }
    if (mode === 'numeric') {
      return { filters: [{ services: [FTMS_SERVICE] }, { namePrefix: 'FS-' }], optionalServices: [FTMS_SERVICE, FITSHOW_SVC] };
    }
    // Default: filtro per nome + UUID testuali (Bluefy rifiuta la variante numerica con codice 2)
    return { filters: [{ namePrefix: 'FS-' }], optionalServices: [uuid16(FTMS_SERVICE), uuid16(FITSHOW_SVC)] };
  }

  async function connect(mode = 'default') {
    if (!navigator.bluetooth) {
      alert('Questo browser non supporta Web Bluetooth. Su iPhone usa Bluefy; su PC/Android usa Chrome.');
      return;
    }
    if (connecting) return;
    if (device && device.gatt.connected) {
      log('Già connesso: chiudo la connessione esistente prima di una nuova richiesta.');
      device.gatt.disconnect();
    }
    connecting = true;
    // requestDevice va chiamato subito, senza await prima, per non perdere il "gesto utente"
    try {
      log(`requestDevice (modalità: ${mode})`);
      device = await navigator.bluetooth.requestDevice(requestOptions(mode));
      device.addEventListener('gattserverdisconnected', () => {
        log('Disconnesso.'); cp = null; setConnected(false); stopTimer();
      });
      log(`Connessione a ${device.name}…`);
      const server = await device.gatt.connect();
      const svc = await server.getPrimaryService(FTMS_SERVICE);

      const data = await svc.getCharacteristic(TREADMILL_DATA);
      data.addEventListener('characteristicvaluechanged', onTreadmillData);
      await data.startNotifications();
      log('Notifiche Treadmill Data attive.');

      try {
        const r = await (await svc.getCharacteristic(SPEED_RANGE)).readValue();
        range = { min: r.getUint16(0, true) / 100, max: r.getUint16(2, true) / 100, inc: r.getUint16(4, true) / 100 };
        log(`Range velocità: ${range.min}–${range.max} km/h, passo ${range.inc}`);
      } catch (e) { log(`Range velocità non leggibile (uso 1–6): ${e.message}`); }

      try {
        const st = await svc.getCharacteristic(MACHINE_STATUS);
        st.addEventListener('characteristicvaluechanged', onStatus);
        await st.startNotifications();
      } catch (e) { log(`Stato macchina non disponibile: ${e.message}`); }

      try {
        cp = await svc.getCharacteristic(CONTROL_POINT);
        cp.addEventListener('characteristicvaluechanged', onControlPoint);
        await cp.startNotifications(); // indicazioni del Control Point
        setConnected(true);
        await write([0x00], 'Request Control');
      } catch (e) {
        log(`✗ Control Point non disponibile: ${e.message}`);
        setConnected(true);
      }

      // Diagnostica: caratteristiche del servizio proprietario FitShow (FFF0)
      try {
        const fs = await server.getPrimaryService(FITSHOW_SVC);
        for (const c of await fs.getCharacteristics()) {
          const p = Object.entries(c.properties).filter(([, v]) => v === true).map(([k]) => k).join(',');
          log(`FFF0 → caratteristica ${c.uuid} [${p}]`);
        }
      } catch (e) { log(`FFF0 non ispezionabile: ${e.message}`); }

      try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
    } catch (e) {
      log(`✗ Connessione fallita: ${describeError(e)}`);
      // Se una connessione precedente è ancora attiva, non mostrare "Non connesso"
      setConnected(!!(device && device.gatt.connected && cp));
    } finally {
      connecting = false;
    }
  }

  if (navigator.bluetooth && navigator.bluetooth.getAvailability) {
    navigator.bluetooth.getAvailability()
      .then(a => log(`Bluetooth disponibile per il browser: ${a}`))
      .catch(e => log(`getAvailability fallita: ${describeError(e)}`));
  }

  $('connect').onclick = () => {
    if (device && device.gatt.connected) device.gatt.disconnect();
    else connect();
  };
  $('start').onclick = start;
  $('stop').onclick = stop;
  $('pause').onclick = pause;
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => changeSpeed(parseFloat(b.dataset.d)));
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => requestSpeed(parseFloat(b.dataset.p)));

  $('testStr').onclick = () => connect('numeric');
  $('testAll').onclick = () => connect('all');

  $('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(logEl.value); }
    catch (_) { logEl.select(); document.execCommand('copy'); }
  };
  $('clear').onclick = () => { logEl.value = ''; };

  document.addEventListener('keydown', e => {
    if (!cp) return;
    if (e.key === ' ' || e.key === 'Escape') { e.preventDefault(); stop(); }
    else if (e.key === 'Enter') { e.preventDefault(); start(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); changeSpeed(e.shiftKey ? 0.5 : 0.1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); changeSpeed(e.shiftKey ? -0.5 : -0.1); }
  });

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && wakeLock === null && 'wakeLock' in navigator && device?.gatt.connected) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
    }
  });
})();
</script>
</body>
</html>
